# Development setup for Barista
#
#   docker compose run dev
#   docker compose run --rm dev pi

services:
  dev:
    build: .
    image: "barista"
    working_dir: "/workspace"
    command: "bash"
    environment:
      - OPENROUTER_API_KEY
    volumes:
      - ".:/workspace"
      - "${HOME}/.agents:/root/.agents"
      - "${HOME}/.pi:/root/.pi"
      - go-build-cache:/root/.cache/go-build
      - go-mod-cache:/root/go/pkg/mod
    mem_limit: "2G"
    cpus: 2

volumes:
  go-build-cache:
  go-mod-cache:
